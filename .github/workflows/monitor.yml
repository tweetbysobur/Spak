# External scheduler for SPak's execution monitor (Vercel Hobby crons run at most once a day).
# Needs repository secrets SPAK_MONITOR_URL (https://<domain>/api/internal/monitor) and SPAK_MONITOR_SECRET.
name: execution-monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency:
  group: execution-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run monitor
        env:
          URL: ${{ secrets.SPAK_MONITOR_URL }}
          SECRET: ${{ secrets.SPAK_MONITOR_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "Monitor secrets not set; skipping."; exit 0; fi
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST -H "Authorization: Bearer $SECRET" --max-time 90 "$URL")
          cat out.json; echo
          test "$code" = "200"
